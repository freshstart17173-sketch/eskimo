name: Deploy to GitHub Pages

# Vite static build, deployed to Pages. Supabase/R2 config already lives in
# src/config.js (the Supabase piece is real; the R2 upload URL is blank
# until worker/upload-worker.js is deployed) — this workflow can override
# it at build time from repo secrets if you'd rather not commit values
# directly, but committing src/config.js's anon key is fine (see TODO.md
# for why that key is safe to ship).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Override config from repo secrets, if set
        if: ${{ secrets.SUPABASE_URL != '' || secrets.SUPABASE_ANON_KEY != '' || secrets.UPLOAD_WORKER_URL != '' }}
        run: |
          set -eu
          python3 - "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$UPLOAD_WORKER_URL" <<'PY'
          import re, sys
          supabase_url, anon_key, worker_url = sys.argv[1:4]
          path = 'src/config.js'
          with open(path) as f:
              src = f.read()
          def replace(field, value):
              global src
              if value:
                  src = re.sub(field + r": '[^']*'", field + ": '%s'" % value, src)
          replace('SUPABASE_URL', supabase_url)
          replace('SUPABASE_ANON_KEY', anon_key)
          replace('UPLOAD_WORKER_URL', worker_url)
          with open(path, 'w') as f:
              f.write(src)
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPLOAD_WORKER_URL: ${{ secrets.UPLOAD_WORKER_URL }}

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
