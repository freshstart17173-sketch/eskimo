name: Deploy to GitHub Pages

# Static single-file app, no build step — this just injects your config
# values (repo secrets, never committed) into a copy of index.html and
# publishes it. Leave the secrets unset and it deploys exactly as
# committed (local-storage only, sync/upload off).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject config from repo secrets
        run: |
          set -eu
          mkdir -p dist
          cp index.html dist/index.html
          # Only replaces the three empty placeholders declared in index.html —
          # a no-op (deploys as-is) if you haven't added the secrets yet.
          python3 - "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$UPLOAD_WORKER_URL" <<'PY'
          import re, sys
          supabase_url, anon_key, worker_url = sys.argv[1:4]
          with open('dist/index.html') as f:
              html = f.read()
          html = html.replace("SUPABASE_URL: '',", "SUPABASE_URL: '%s'," % supabase_url)
          html = html.replace("SUPABASE_ANON_KEY: '',", "SUPABASE_ANON_KEY: '%s'," % anon_key)
          html = html.replace("UPLOAD_WORKER_URL: '',", "UPLOAD_WORKER_URL: '%s'," % worker_url)
          with open('dist/index.html', 'w') as f:
              f.write(html)
          PY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPLOAD_WORKER_URL: ${{ secrets.UPLOAD_WORKER_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
