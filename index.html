function UploadSongPage({ onAddSong, onViewSong, existingCount }) {
  const [title, setTitle] = useState('');
  const [artist, setArtist] = useState('');
  const [bpm, setBpm] = useState('');
  const [key, setKey] = useState('');
  const [file, setFile] = useState(null);
  const [error, setError] = useState('');
  const [saved, setSaved] = useState(null); // { id, title } | null

  function save() {
    if (!title.trim()) { setError('Give the song a title.'); return; }
    const bpmNum = Number(bpm);
    if (bpm.trim() && (!Number.isFinite(bpmNum) || bpmNum <= 0)) { setError('BPM should be a positive number.'); return; }
    setError('');
    const id = uid('s');
    const song = {
      id, title: title.trim(), artist: artist.trim() || 'Unknown',
      x: 60 + (existingCount * 47) % 1180, y: 60 + (existingCount * 83) % 700,
      versions: [{ id: 'v1', label: 'Original', bpm: bpmNum || 120, key: key.trim() || '—' }],
    };
    onAddSong(song);
    setSaved({ id, title: song.title });
    setTitle(''); setArtist(''); setBpm(''); setKey(''); setFile(null);
  }

  return (
    <div className="page page-scroll page-narrow">
      <div className="page-title">Upload Song</div>
      <div className="page-sub">Add a new master to the library. Full-body differences (instrumental, acapella, remaster) are their own song — use Add Audio → Remix instead if this is just a new version.</div>

      <div className="form-card">
        <Field label="Title">
          <input className="input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Faultline Blue" />
        </Field>
        <Field label="Artist">
          <input className="input" value={artist} onChange={(e) => setArtist(e.target.value)} placeholder="e.g. Nomi Sato" />
        </Field>
        <div className="form-grid-2">
          <Field label="BPM">
            <input className="input" value={bpm} onChange={(e) => setBpm(e.target.value)} placeholder="126" inputMode="numeric" />
          </Field>
          <Field label="Key">
            <input className="input" value={key} onChange={(e) => setKey(e.target.value)} placeholder="A min" />
          </Field>
        </div>
        <Field label="Master audio">
          <Dropzone file={file} onFile={setFile} hint="drop lossless master (WAV/AIFF/FLAC preferred; MP3 accepted, flagged)" />
        </Field>
        {error && <div className="error-note">{error}</div>}
        <button className="btn btn-primary btn-self-start" onClick={save}>Add to library</button>
        {saved && (
          <div className="success-note">
            <span>Added "{saved.title}" to the library.</span>
            <button className="btn btn-primary btn-sm" onClick={() => onViewSong(saved.id)}>View in Library</button>
          </div>
        )}
      </div>
    </div>
  );
}
// =====================================================================================
// Add Audio — drop a produced piece; we detect what it connects and let you confirm.
// Replaces the old manual "pick a type, pick both sides, generate a sync code" flow —
// detection now does the matching, so the only controls left are the ones a human
// actually needs: confirming (or correcting) the match, and how each hop is built.
// =====================================================================================

function AddAudioPage({ songs, session, onAddEdge, onAddVersion, onViewSong }) {
  const [mode, setMode] = useState('pair'); // 'pair' | 'remix'
  const [file, setFile] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [detected, setDetected] = useState(false);

  const [leftId, setLeftId] = useState(null);
  const [rightId, setRightId] = useState(null);
  const [remixSongId, setRemixSongId] = useState(null);
  const [versionLabel, setVersionLabel] = useState('');
  const [remixBpm, setRemixBpm] = useState('');
  const [remixKey, setRemixKey] = useState('');
  const [fragLabel, setFragLabel] = useState('');

  const [error, setError] = useState('');
  const [saved, setSaved] = useState(null); // { kind, label, songId }

  const songIds = Object.keys(songs);

  function reset() {
    setFile(null); setAnalyzing(false); setDetected(false);
    setLeftId(null); setRightId(null); setRemixSongId(null);
    setVersionLabel(''); setRemixBpm(''); setRemixKey(''); setFragLabel(''); setError('');
  }

  function handleFile(f) {
    setFile(f); setAnalyzing(true); setDetected(false); setSaved(null);
    const seed = f.name + '|' + f.size;
    setTimeout(() => {
      if (mode === 'pair') {
        const [a, b] = pickDetectedSongs(songIds, seed, 2);
        setLeftId(a || null); setRightId(b || null);
      } else {
        const [a] = pickDetectedSongs(songIds, seed, 1);
        setRemixSongId(a || null);
        if (a && songs[a]) {
          const v = activeVersion(songs[a], session.versionOf);
          setRemixBpm(String(v.bpm)); setRemixKey(v.key);
        }
      }
      setAnalyzing(false); setDetected(true);
    }, 700);
  }

  const leftSong = leftId ? songs[leftId] : null;
  const rightSong = rightId ? songs[rightId] : null;
  const derivedType = leftId && rightId ? 'transition' : rightId ? 'intro' : leftId ? 'outro' : null;
  const cue = detected ? pseudoCuePoints(leftId, rightId) : null;

  function saveEdgeOrVersion() {
    if (mode === 'remix') {
      if (!remixSongId) { setError('Pick which song this is a remix of.'); return; }
      const bpmNum = Number(remixBpm);
      if (!Number.isFinite(bpmNum) || bpmNum <= 0) { setError('BPM should be a positive number.'); return; }
      const versionData = { id: uid('v'), label: versionLabel.trim() || 'New Version', bpm: bpmNum, key: remixKey.trim() || '—' };
      onAddVersion(remixSongId, versionData);
      setSaved({ kind: 'version', label: versionData.label, songId: remixSongId });
      reset();
      return;
    }
    if (!derivedType) { setError('This needs at least one song — pick a left and/or right side.'); return; }
    const leftVer = leftId ? activeVersionId(songs[leftId], session.versionOf) : undefined;
    const rightVer = rightId ? activeVersionId(songs[rightId], session.versionOf) : undefined;
    const bpmDelta = leftSong && rightSong ? activeVersion(rightSong, session.versionOf).bpm - activeVersion(leftSong, session.versionOf).bpm : undefined;
    const keyChange = leftSong && rightSong ? activeVersion(leftSong, session.versionOf).key !== activeVersion(rightSong, session.versionOf).key : false;
    const edge = {
      id: uid('e'), type: derivedType,
      l: leftId || undefined, lv: leftVer, r: rightId || undefined, rv: rightVer,
      verified: false, bpmDelta, keyChange, remix: false, label: fragLabel.trim() || undefined,
    };
    onAddEdge(edge);
    setSaved({ kind: 'edge', label: derivedType, songId: rightId || leftId });
    reset();
  }

  const typeLabel = derivedType ? ({ transition: 'Transition', intro: 'Intro', outro: 'Outro' })[derivedType] : '—';

  if (songIds.length === 0) {
    return (
      <div className="page page-scroll page-narrow-wide">
        <div className="page-title">Add Audio</div>
        <div className="empty-state">
          <div className="empty-state-title">Add a song first</div>
          <div className="empty-state-sub">You'll need at least one song in the library before there's anything to connect.</div>
        </div>
      </div>
    );
  }

  return (
    <div className="page page-scroll page-narrow-wide">
      <div className="page-title">Add Audio</div>
      <div className="page-sub">Drop a produced transition, intro, outro, or remix — we detect the song(s), type, and cue points automatically.</div>

      <div className="pill-group" style={{ marginBottom: 18 }}>
        <button className={'pill' + (mode === 'pair' ? ' active' : '')} onClick={() => { setMode('pair'); reset(); }}>Transition / Intro / Outro</button>
        <button className={'pill' + (mode === 'remix' ? ' active' : '')} onClick={() => { setMode('remix'); reset(); }}>Remix (new version)</button>
      </div>

      <div className="form-card">
        <Field label={mode === 'remix' ? 'Remix audio' : 'Produced audio'}>
          <Dropzone file={file} onFile={handleFile} hint={mode === 'remix' ? 'drop the remixed/edited audio' : 'drop the finished transition, intro, or outro render'} />
        </Field>

        {analyzing && <div className="hint-text analyzing-hint">Analyzing audio…</div>}

        {detected && mode === 'pair' && (
          <>
            <div className="detected-label">Detected</div>
            <div className="pair-grid">
              <div>
                <div className="field-label">Left side (what it plays out of)</div>
                <SongPicker songs={songs} value={leftId} onChange={setLeftId} allowFree freeLabel="Free — starts the set" />
              </div>
              <div>
                <div className="field-label">Right side (what it plays into)</div>
                <SongPicker songs={songs} value={rightId} onChange={setRightId} allowFree freeLabel="Free — ends the set" />
              </div>
            </div>

            <div className="detected-summary">
              <span className="tag tag-neutral">Type: {typeLabel}</span>
              {leftSong && rightSong && (
                <>
                  <span className="tag tag-accent">{activeVersion(leftSong, session.versionOf).bpm} → {activeVersion(rightSong, session.versionOf).bpm} BPM</span>
                  <span className="tag tag-good">{activeVersion(leftSong, session.versionOf).key} → {activeVersion(rightSong, session.versionOf).key}</span>
                </>
              )}
            </div>

            {cue && (
              <div className="cue-grid">
                {leftSong && (
                  <div>
                    <div className="field-label">{leftSong.title} — detected out point</div>
                    <div className="waveform-bar">
                      <div className="waveform-marker" style={{ left: '71%' }} />
                      <div className="waveform-marker-label" style={{ left: '71%' }}>OUT <span className="mono-num">{fmtTime(cue.outSeconds)}</span></div>
                    </div>
                  </div>
                )}
                {rightSong && (
                  <div>
                    <div className="field-label">{rightSong.title} — detected in point</div>
                    <div className="waveform-bar">
                      <div className="waveform-marker" style={{ left: '12%' }} />
                      <div className="waveform-marker-label" style={{ left: '12%' }}>IN <span className="mono-num">{fmtTime(cue.inSeconds)}</span></div>
                    </div>
                  </div>
                )}
              </div>
            )}

            <Field label="Note (optional)">
              <input className="input" value={fragLabel} onChange={(e) => setFragLabel(e.target.value)} placeholder="e.g. Tempo drop into verse" />
            </Field>
          </>
        )}

        {detected && mode === 'remix' && (
          <>
            <div className="detected-label">Detected</div>
            <Field label="Original song">
              <SongPicker songs={songs} value={remixSongId} onChange={(id) => {
                setRemixSongId(id);
                if (id && songs[id]) { const v = activeVersion(songs[id], session.versionOf); setRemixBpm(String(v.bpm)); setRemixKey(v.key); }
              }} placeholder="Search songs…" />
            </Field>
            <div className="form-grid-3">
              <Field label="Version name"><input className="input" value={versionLabel} onChange={(e) => setVersionLabel(e.target.value)} placeholder="VIP Remix" /></Field>
              <Field label="BPM"><input className="input" value={remixBpm} onChange={(e) => setRemixBpm(e.target.value)} /></Field>
              <Field label="Key"><input className="input" value={remixKey} onChange={(e) => setRemixKey(e.target.value)} /></Field>
            </div>
          </>
        )}

        {error && <div className="error-note">{error}</div>}

        {detected && (
          <button className="btn btn-primary btn-self-start" onClick={saveEdgeOrVersion}>
            {mode === 'remix' ? 'Add version' : 'Save ' + typeLabel}
          </button>
        )}

        {saved && (
          <div className="success-note">
            <span>{saved.kind === 'version' ? 'Added "' + saved.label + '" as a new version.' : 'Saved — unverified. Preview it from the song panel to verify it.'}</span>
            {saved.songId && <button className="btn btn-primary btn-sm" onClick={() => onViewSong(saved.songId)}>View in Library</button>}
          </div>
        )}
      </div>
    </div>
  );
}
// =====================================================================================
// Settings — venue name, data reset, and a manual JSON export/import (a stand-in for
// the eventual Supabase sync — swap these two buttons for real sync calls later).
// =====================================================================================

function SettingsPage({ venueName, setVenueName, songs, edges, session, onClearAll, onRestore }) {
  const [confirmingReset, setConfirmingReset] = useState(false);
  const fileInputRef = useRef(null);
  const [importError, setImportError] = useState('');

  function downloadBackup() {
    const data = { songs, edges, session, venueName };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'djflow-backup.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function handleImportFile(fileList) {
    const f = fileList && fileList[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.songs || !data.edges || !data.session) throw new Error('missing fields');
        onRestore(data);
        setImportError('');
      } catch (e) {
        setImportError('That file doesn\u2019t look like a DJ Flow backup.');
      }
    };
    reader.readAsText(f);
  }

  return (
    <div className="page page-scroll page-narrow">
      <div className="page-title">Settings</div>
      <div className="page-sub">Data lives in this browser for now (localStorage) — this is the seam where Supabase + Cloudflare storage will plug in later.</div>

      <div className="form-card">
        <Field label="Venue / session name">
          <input className="input" value={venueName} onChange={(e) => setVenueName(e.target.value)} placeholder="e.g. Friday Warehouse" />
        </Field>
      </div>

      <div className="section-label" style={{ marginTop: 24 }}>Backup</div>
      <div className="form-card">
        <div className="settings-row">
          <div>
            <div className="settings-row-title">Download a backup</div>
            <div className="settings-row-sub">Saves your whole library and set state to a JSON file.</div>
          </div>
          <button className="btn btn-ghost" onClick={downloadBackup}>Download</button>
        </div>
        <div className="settings-row">
          <div>
            <div className="settings-row-title">Restore from a backup</div>
            <div className="settings-row-sub">Replaces everything currently in the browser.</div>
          </div>
          <button className="btn btn-ghost" onClick={() => fileInputRef.current && fileInputRef.current.click()}>Restore…</button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: 'none' }} onChange={(e) => handleImportFile(e.target.files)} />
        </div>
        {importError && <div className="error-note">{importError}</div>}
      </div>

      <div className="section-label" style={{ marginTop: 24 }}>Reset</div>
      <div className="form-card">
        <div className="settings-row">
          <div>
            <div className="settings-row-title">Clear all data</div>
            <div className="settings-row-sub">Wipes every song, transition, and set state saved in this browser. This does not undo — download a backup first if you're not sure.</div>
          </div>
          {!confirmingReset ? (
            <button className="btn btn-danger" onClick={() => setConfirmingReset(true)}>Clear…</button>
          ) : (
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="btn btn-ghost btn-sm" onClick={() => setConfirmingReset(false)}>Cancel</button>
              <button className="btn btn-danger btn-sm" onClick={onClearAll}>Confirm — clear everything</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// =====================================================================================
// Inspect drawer — song detail & curation. Shared by Perform's graph and Library's
// table so there's exactly one place this logic lives.
// =====================================================================================

function InspectDrawer({ song, songs, edges, versionOf, linkingId, setLinkingId, onClose, onSetVersion, onVerifyEdge, onDeleteEdge, onUpdateSong, onDeleteSong }) {
  const [editing, setEditing] = useState(false);
  const [draftTitle, setDraftTitle] = useState(song.title);
  const [draftArtist, setDraftArtist] = useState(song.artist);
  const [draftBpm, setDraftBpm] = useState('');
  const [draftKey, setDraftKey] = useState('');

  const vid = activeVersionId(song, versionOf);
  const av = activeVersion(song, versionOf);

  useEffect(() => {
    setDraftTitle(song.title); setDraftArtist(song.artist);
    setDraftBpm(String(av.bpm)); setDraftKey(av.key);
    setEditing(false);
  }, [song.id, vid]);

  function saveEdits() {
    const bpmNum = Number(draftBpm);
    const versions = song.versions.map(v => v.id === vid ? { ...v, bpm: Number.isFinite(bpmNum) && bpmNum > 0 ? bpmNum : v.bpm, key: draftKey.trim() || v.key } : v);
    onUpdateSong(song.id, { title: draftTitle.trim() || song.title, artist: draftArtist.trim() || song.artist, versions });
    setEditing(false);
  }

  function destText(e) {
    if (e.type === 'outro') return 'ends set';
    if (e.type === 'intro') return 'cold-open';
    const other = e.l === song.id ? e.r : e.l;
    const otherSong = songs[other];
    return (e.l === song.id ? '\u2192 ' : '\u2190 ') + (otherSong ? otherSong.title : '(deleted song)');
  }
  function labelOf(e) { return e.type === 'outro' ? 'Outro' : e.type === 'intro' ? 'Intro' : 'Transition'; }

  const ownTransitions = edges.filter(e => (e.l === song.id && e.lv === vid) || (e.r === song.id && e.rv === vid));
  const inheritable = edges.filter(e => !e.verified && ((e.l === song.id && e.lv !== vid) || (e.r === song.id && e.rv !== vid)));
  const linking = linkingId ? edges.find(e => e.id === linkingId) : null;

  function confirmDelete() {
    if (window.confirm('Delete "' + song.title + '"? This also removes every transition/intro/outro that touches it.')) {
      onDeleteSong(song.id);
    }
  }

  return (
    <div className="drawer">
      <div className="drawer-head">
        {!editing ? (
          <div className="drawer-title">{song.title}</div>
        ) : (
          <input className="input drawer-title-input" value={draftTitle} onChange={(e) => setDraftTitle(e.target.value)} />
        )}
        <button className="icon-btn" onClick={onClose}><Icon path={ICONS.close} size={13} /></button>
      </div>

      {!editing ? (
        <div className="drawer-artist">{song.artist}</div>
      ) : (
        <input className="input" style={{ marginBottom: 10 }} value={draftArtist} onChange={(e) => setDraftArtist(e.target.value)} placeholder="Artist" />
      )}

      {song.versions.length > 1 && (
        <div className="version-row">
          {song.versions.map(v => (
            <button key={v.id} className={'seg-btn' + (v.id === vid ? ' active' : '')} onClick={() => onSetVersion(song.id, v.id)}>{v.label}</button>
          ))}
        </div>
      )}

      {!editing ? (
        <div className="tag-row" style={{ marginBottom: 16 }}>
          <span className="tag tag-accent">{av.bpm} BPM</span>
          <span className="tag tag-good">{av.key}</span>
        </div>
      ) : (
        <div className="form-grid-2" style={{ marginBottom: 12 }}>
          <Field label="BPM"><input className="input" value={draftBpm} onChange={(e) => setDraftBpm(e.target.value)} /></Field>
          <Field label="Key"><input className="input" value={draftKey} onChange={(e) => setDraftKey(e.target.value)} /></Field>
        </div>
      )}

      <div className="drawer-actions-row">
        {!editing ? (
          <button className="btn btn-ghost btn-sm" onClick={() => setEditing(true)}>Edit details</button>
        ) : (
          <>
            <button className="btn btn-primary btn-sm" onClick={saveEdits}>Save</button>
            <button className="btn btn-ghost btn-sm" onClick={() => setEditing(false)}>Cancel</button>
          </>
        )}
        <button className="btn btn-danger btn-sm" onClick={confirmDelete}>Delete song</button>
      </div>

      <div className="section-label">Audio — this version</div>
      <div className="drawer-list">
        {ownTransitions.map(e => (
          <div key={e.id} className="drawer-frag">
            <div className="drawer-frag-row">
              <span className="drawer-frag-label">{labelOf(e)}</span>
              {e.verified && <span className="dot-verified" />}
              <div className="drawer-frag-actions">
                {!e.verified && <button className="btn btn-ghost btn-xs" onClick={() => onVerifyEdge(e.id)}>Preview &amp; verify</button>}
                <button className="btn btn-ghost btn-xs" onClick={() => { if (window.confirm('Remove this ' + labelOf(e).toLowerCase() + '?')) onDeleteEdge(e.id); }}>Remove</button>
              </div>
            </div>
            <div className="drawer-frag-dest">{destText(e)}</div>
          </div>
        ))}
        {ownTransitions.length === 0 && <div className="empty-note-sm">no audio attached to this version yet</div>}
      </div>

      <div className="section-label">Inherit from other versions</div>
      <div className="drawer-list">
        {inheritable.map(e => {
          const sibVersion = song.versions.find(v => v.id === (e.l === song.id ? e.lv : e.rv));
          return (
            <div key={e.id} className="drawer-frag drawer-frag-inheritable">
              <div className="drawer-frag-row">
                <span className="drawer-frag-label drawer-frag-label-muted">from {sibVersion ? sibVersion.label : '?'}</span>
                <button className="btn btn-primary btn-xs" onClick={() => setLinkingId(e.id)}>Link</button>
              </div>
              <div className="drawer-frag-dest">{destText(e)}</div>
            </div>
          );
        })}
        {inheritable.length === 0 && <div className="empty-note-sm">nothing to inherit for this version</div>}
      </div>

      {linking && (
        <div className="linking-panel">
          <div className="linking-title">Sync {linking.type === 'outro' ? 'outro' : linking.type === 'intro' ? 'intro' : 'transition'}</div>
          <div className="linking-waveform" />
          <div className="linking-nudge">
            <button className="btn btn-ghost btn-xs">−10ms</button>
            <span className="linking-nudge-label">nudge to align</span>
            <button className="btn btn-ghost btn-xs">+10ms</button>
          </div>
          <div className="drawer-actions-row">
            <button className="btn btn-ghost btn-sm" onClick={() => setLinkingId(null)}>Cancel</button>
            <button className="btn btn-primary btn-sm" onClick={() => setLinkingId(null)}>Confirm link</button>
          </div>
        </div>
      )}
    </div>
  );
}

// =====================================================================================
// A minimal error boundary — surfaces a readable message instead of a blank page
// while this is still being developed.
// =====================================================================================
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('DJ Flow crashed:', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 40, fontFamily: 'monospace', whiteSpace: 'pre-wrap', color: '#a3312a' }}>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Something broke: {String(this.state.error && this.state.error.message || this.state.error)}</div>
          {this.state.error && this.state.error.stack}
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
