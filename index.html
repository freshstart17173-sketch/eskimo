<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eskimo Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<!--
  Eskimo Studio — single-file build

  Stack: React 18 + Babel Standalone, loaded from CDN, no build step.
  Data lives in this browser's localStorage first (see the Store object in the
  first <script> below) and, once you've filled in APP_CONFIG below, syncs in
  the background to Supabase so your graph follows you across devices. Nothing
  here is demo/seed data; the app starts completely empty and everything comes
  from what you add.

  See TODO.md for exactly what to do to turn on cloud sync + audio storage,
  the feature backlog, and the design-system reasoning — read that before
  making changes.

  Files:
    - core.js    (inlined below, plain JS)   data model, persistence, pure logic
    - app.jsx    (inlined below, JSX)        React components / UI
    - styles.css (inlined below)             all styling

  To split this back into real files for a bundler (Vite, etc.), the three
  <script>/<style> blocks below are exactly core.js / app.jsx / styles.css.
-->

<script>
  // Fill these in once you've done the "Your tasks" steps in TODO.md. Leave
  // them blank and the app works exactly as before — local-storage only, no
  // network calls, nothing to configure. Only the anon key belongs here (never
  // a service_role key) — it's safe to ship in a static site because Supabase
  // Row Level Security, not secrecy of this key, is what protects your data.
  window.APP_CONFIG = {
    SUPABASE_URL: '',        // e.g. https://xxxxxxxxxxxx.supabase.co
    SUPABASE_ANON_KEY: '',   // Project Settings -> API -> anon public key
    UPLOAD_WORKER_URL: '',   // your deployed worker/upload-worker.js endpoint
  };
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>

   pastel purple — spent only on interactive/active state. Data tags
   (BPM, key, warnings) are plain bordered mono boxes, not colored
   pills: the content says what it is, color doesn't need to.
   =================================================================== */

:root {
  --ink: #131313;
  --paper: #fcfcfc;
  --panel: #efefef;
  --line: #c2c2c2;
  --line-soft: #dadada;
  --muted: #454545;
  --faint: #6c6c6c;

  --accent: #8b7bb8;          /* dusty pastel purple — the one accent color */
  --accent-bg: #eeeaf7;
  --accent-light: #c9bfe0;    /* lighter tint — secondary/two-hops-out state */
  --accent-ink: #2a2338;      /* dark text for use on a solid accent fill */

  --danger: #8a2f28;
  --danger-bg: #f7ece9;
  --good: #131313;
  --good-bg: #efefef;

  --radius: 2px;
  --font: 'Jost', 'Avenir Next', 'Segoe UI', Arial, sans-serif;
  --font-display: 'Gnomon', var(--font);
  --font-mono: 'Drafting Mono', 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
}

* { box-sizing: border-box; scrollbar-width: thin; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14.5px;
  font-weight: 500;
  -webkit-font-smoothing: antialiased;
}
button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }
a { color: var(--accent); }
table { font-family: inherit; }

/* numeric readouts — BPM, timecodes, countdown — read like a hardware display */
.mono-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

@keyframes pulseRing {
  0% { box-shadow: 0 0 0 0 rgba(139, 123, 184, .4); }
  70% { box-shadow: 0 0 0 8px rgba(139, 123, 184, 0); }
  100% { box-shadow: 0 0 0 0 rgba(139, 123, 184, 0); }
}

/* ---------------------------------------------------------------
   App shell / sidebar
   --------------------------------------------------------------- */
.app-shell { height: 100vh; display: flex; }

.sidebar {
  width: 188px; flex: none; background: var(--panel);
  display: flex; flex-direction: column; padding: 18px 8px 16px;
  border-right: 1px solid var(--line-soft);
}
.sidebar-brand { padding: 0 8px 18px; line-height: 1; }
.sidebar-brand-word { font-family: var(--font-display); font-size: 27px; color: var(--ink); }
.sidebar-brand-sub { font-size: 10px; font-weight: 600; letter-spacing: .18em; color: var(--muted); margin-top: 4px; }
.nav-btn {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; padding: 8px 9px; border-radius: var(--radius);
  text-align: left; width: 100%; color: var(--muted); margin-bottom: 1px;
}
.nav-btn:hover { background: rgba(19, 19, 19, .05); }
.nav-btn.active { color: var(--paper); background: var(--ink); }
.nav-btn.active:hover { background: var(--ink); }
.sidebar-footer { margin-top: auto; padding: 8px 9px 2px; font-size: 11px; color: var(--faint); line-height: 1.6; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; position: relative; }

/* ---------------------------------------------------------------
   Generic page scaffolding
   --------------------------------------------------------------- */
.page { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.page-scroll { padding: 22px 26px; overflow-y: auto; }
.page-narrow { max-width: 560px; margin: 0 auto; width: 100%; }
.page-narrow-wide { max-width: 640px; margin: 0 auto; width: 100%; }
.page-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.page-title { font-weight: 600; font-size: 21px; }
.page-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

.section-label {
  font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; margin-bottom: 7px;
}
.section-label-dark { color: rgba(252, 252, 252, .6); margin-top: 12px; }

.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; text-align: center; padding: 36px; color: var(--muted);
}
.empty-state-title { font-size: 17px; font-weight: 600; color: var(--ink); }
.empty-state-sub { font-size: 13px; color: var(--muted); max-width: 320px; }
.empty-note { font-size: 13px; color: var(--faint); font-style: italic; padding: 16px 4px; }
.empty-note-sm { font-size: 11px; color: var(--muted); font-style: italic; }
.hint-text { font-size: 11px; color: var(--faint); font-style: italic; }
.error-note { font-size: 12px; color: var(--danger); background: var(--danger-bg); padding: 6px 10px; border-radius: var(--radius); margin: 4px 0; }
.success-note {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 12px; padding: 7px 11px; border-radius: var(--radius); background: var(--good-bg); color: var(--good); margin-top: 8px;
  border: 1px solid var(--line);
}

/* ---------------------------------------------------------------
   Buttons / inputs / tags
   --------------------------------------------------------------- */
.btn { font-size: 13px; font-weight: 600; padding: 7px 14px; border-radius: var(--radius); }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-accent { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--panel); color: var(--ink); }
.btn-danger { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
.btn-sm { font-size: 12px; padding: 5px 10px; }
.btn-xs { font-size: 11px; padding: 3px 7px; }
.btn-self-start { align-self: flex-start; }

.input {
  width: 100%; min-height: 32px; padding: 5px 9px; font-size: 13px; font-weight: 500;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink);
}
.input:focus { outline: 2px solid var(--accent-light); outline-offset: -1px; }

.icon-btn {
  width: 24px; height: 24px; border-radius: var(--radius); background: var(--panel);
  display: flex; align-items: center; justify-content: center; color: #363636; flex: none;
}
.icon-btn-dark { background: rgba(252, 252, 252, .14); color: var(--paper); width: 20px; height: 20px; }

/* brutalist data tag: plain bordered box, monospace, no fill, no color-coding */
.tag {
  display: inline-flex; font-family: var(--font-mono); font-size: 10px; font-weight: 400; padding: 1px 5px;
  border-radius: 0; line-height: 1.6; border: 1px solid var(--ink); color: var(--ink); background: transparent;
}
.tag-accent, .tag-good, .tag-warn, .tag-purple, .tag-neutral, .tag-on-dark { border-color: var(--ink); color: var(--ink); background: transparent; }
.tag-row { display: flex; gap: 5px; margin-bottom: 14px; }

.pill-group { display: flex; gap: 4px; }
.pill { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: var(--radius); background: var(--panel); color: var(--muted); }
.pill.active { background: var(--accent); color: var(--accent-ink); }

.field { margin-bottom: 12px; }
.field-label { display: block; font-size: 12px; margin-bottom: 4px; color: var(--muted); font-weight: 500; }

.form-card { border-radius: var(--radius); background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; }
.settings-row-title { font-size: 13px; font-weight: 600; }
.settings-row-sub { font-size: 11.5px; color: var(--muted); max-width: 420px; }

/* dropzone */
.dropzone {
  min-height: 50px; padding: 9px; font-size: 12px; background: var(--paper);
  border: 1px dashed #a2a2a2; border-radius: var(--radius);
  display: flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer;
}
.dropzone-active { border-color: var(--accent); background: var(--accent-bg); }
.dropzone-hint { color: var(--muted); }
.dropzone-file { display: flex; flex-direction: column; gap: 1px; }
.dropzone-file-name { font-weight: 600; color: var(--ink); font-size: 12.5px; }
.dropzone-file-size { color: var(--muted); font-size: 11px; font-family: var(--font-mono); }
.analyzing-hint { margin: 4px 0 8px; }

/* searchable song picker */
.picker-chip {
  display: flex; align-items: center; gap: 9px; padding: 7px 9px;
  border-radius: var(--radius); background: var(--paper); border: 1px solid var(--line);
}
.picker-chip-free { background: var(--panel); border-style: dashed; }
.picker-chip-art { width: 26px; height: 26px; flex: none; border-radius: var(--radius); background: repeating-linear-gradient(45deg, rgba(19, 19, 19, .12) 0 3px, transparent 3px 6px); }
.picker-chip-text { flex: 1; min-width: 0; }
.picker-chip-title { font-weight: 600; font-size: 12.5px; }
.picker-chip-artist { font-size: 11px; color: var(--muted); }
.picker-open { display: flex; flex-direction: column; gap: 5px; }
.picker-results { max-height: 170px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: var(--radius); padding: 3px; background: var(--paper); }
.picker-result { display: flex; justify-content: space-between; gap: 8px; padding: 5px 7px; border-radius: var(--radius); font-size: 12.5px; text-align: left; }
.picker-result:hover { background: var(--panel); }
.picker-result-free { color: var(--muted); font-style: italic; }

<body>
<div id="root"></div>

<script>
// =====================================================================================
// Eskimo Studio — core data model & pure logic (no React/JSX here — plain JS, easy to
// unit test). A song is flat (no version sub-objects) — a remix is just another song.
// =====================================================================================

const END = '__end__';
const STORAGE_KEY = 'djflow:v2';

// ---------------------------------------------------------------------------
// Real app state starts empty — no demo/sample data is ever loaded into the app.
// These sample* functions exist purely so the pure-logic unit tests have some
// realistic data to exercise; nothing in the app itself calls them.
// ---------------------------------------------------------------------------
function sampleSongsForTests() {
  return {
    hd: { id: 'hd', title: 'Horizon Drift', artist: 'Nomi Sato', x: 40, y: 360, bpm: 124, key: 'A min', durationSec: 214 },
    cb: { id: 'cb', title: 'Concrete Bloom', artist: 'Ledger', x: 320, y: 300, bpm: 128, key: 'F# min', durationSec: 198 },
    gs: { id: 'gs', title: 'Glass Static', artist: 'Rook & Vale', x: 620, y: 440, bpm: 126, key: 'G min', durationSec: 231 },
    lr: { id: 'lr', title: 'Late Return', artist: 'Nomi Sato', x: 900, y: 480, bpm: 120, key: 'D min', durationSec: 205 },
    wr: { id: 'wr', title: 'Wire & Rust', artist: 'Rook & Vale', x: 900, y: 600, bpm: 129, key: 'D min', durationSec: 187 },
  };
}
function sampleEdgesForTests() {
  return [
    { id: 'e1', type: 'intro', r: 'hd', verified: true },
    { id: 'e2', type: 'transition', l: 'hd', r: 'cb', verified: true },
    { id: 'e4', type: 'transition', l: 'cb', r: 'gs', verified: true },
    { id: 'e5', type: 'outro', l: 'cb', verified: true },
    { id: 'e6', type: 'transition', l: 'gs', r: 'lr', verified: false },
    { id: 'e13', type: 'transition', l: 'gs', r: 'wr', verified: true },
    { id: 'e14', type: 'outro', l: 'gs', verified: true },
  ];
}

function emptySession() {
  return {
    nowPlayingId: null, startMethod: null,
    queue: [], timeLeft: 0, isPlaying: false, setEnded: false,
  };
}

// ---------------------------------------------------------------------------
// Persistence. localStorage is always the source of truth for the current
// tab (instant, works offline). When APP_CONFIG has Supabase credentials,
// pushRemote/pullRemote best-effort sync a single JSON blob per (anonymous)
// user in the background — see TODO.md for how to turn this on. Nothing
// about the local-only path below changes when sync is off.
// ---------------------------------------------------------------------------
const Store = {
  load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object') return null;
      return parsed;
    } catch (e) {
      console.warn('Eskimo Studio: could not read saved data, starting fresh.', e);
      return null;
    }
  },
  save(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      console.warn('Eskimo Studio: could not save — storage may be full or disabled.', e);
      return false;
    }
  },
  clear() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
  },
};

// ---------------------------------------------------------------------------
// Optional Supabase sync. Entirely inert until APP_CONFIG.SUPABASE_URL and
// SUPABASE_ANON_KEY are filled in (see TODO.md -> "Your tasks"). Uses
// anonymous auth so cross-device sync works without building a login screen
// yet — one row per anonymous user in a `library` table, RLS-scoped to
// auth.uid() (see supabase/schema.sql).
// ---------------------------------------------------------------------------
const supaConfigured = !!(window.APP_CONFIG && window.APP_CONFIG.SUPABASE_URL && window.APP_CONFIG.SUPABASE_ANON_KEY);
const supa = (supaConfigured && window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_ANON_KEY)
  : null;

async function ensureSupaUser() {
  if (!supa) return null;
  try {
    const { data: { session } } = await supa.auth.getSession();
    if (session && session.user) return session.user;
    const { data, error } = await supa.auth.signInAnonymously();
    if (error) { console.warn('Eskimo Studio: Supabase anonymous sign-in failed', error); return null; }
    return data.user;
  } catch (e) {
    console.warn('Eskimo Studio: Supabase auth unreachable', e);
    return null;
  }
}

Store.pullRemote = async function pullRemote() {
  if (!supa) return null;
  const user = await ensureSupaUser();
  if (!user) return null;
  const { data, error } = await supa.from('library').select('data').eq('user_id', user.id).maybeSingle();
  if (error) { console.warn('Eskimo Studio: Supabase load failed', error); return null; }
  return data ? data.data : null;
};
Store.pushRemote = async function pushRemote(data) {
  if (!supa) return;
  const user = await ensureSupaUser();
  if (!user) return;
  const { error } = await supa.from('library').upsert({ user_id: user.id, data, updated_at: new Date().toISOString() });
  if (error) console.warn('Eskimo Studio: Supabase save failed', error);
};

// ---------------------------------------------------------------------------
// Optional audio upload. Inert until APP_CONFIG.UPLOAD_WORKER_URL is filled
// in (see worker/upload-worker.js + TODO.md). The file is POSTed straight to
// your deployed Cloudflare Worker, which writes it into R2 via its bucket
// binding and hands back a public URL — no R2 credentials, presigning, or
// AWS SDK ever touch the client. Without a worker configured this just
// returns the file's name/size, exactly like before.
// ---------------------------------------------------------------------------
async function uploadAudioIfConfigured(file) {
  const workerUrl = window.APP_CONFIG && window.APP_CONFIG.UPLOAD_WORKER_URL;
  if (!workerUrl || !file || !file.name) return { name: file && file.name, size: file && file.size, audioUrl: null };
  try {
    const res = await fetch(workerUrl + '/upload?filename=' + encodeURIComponent(file.name), {
      method: 'POST',
      headers: { 'Content-Type': file.type || 'application/octet-stream' },
      body: file,
    });
    if (!res.ok) throw new Error('upload failed: ' + res.status);
    const { url } = await res.json();
    return { name: file.name, size: file.size, audioUrl: url };
  } catch (e) {
    console.warn('Eskimo Studio: audio upload failed, keeping metadata only', e);
    return { name: file.name, size: file.size, audioUrl: null };
  }
}

// The one and only "no saved state yet" starting point — a genuinely empty
// library. Nothing is seeded; the person adds their own songs and audio.
function freshState() { return { songs: {}, edges: [], session: emptySession(), venueName: '' }; }

// ---------------------------------------------------------------------------
// Small generic helpers
// ---------------------------------------------------------------------------
function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function fmtTime(s) { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); const sec = s % 60; return m + ':' + (sec < 10 ? '0' : '') + sec; }
function fmtSignedBpm(n) { if (n == null) return ''; return (n > 0 ? '+' : '') + n + ' BPM'; }
function fmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function hashString(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return h;
}

// Deterministic mock track length until real audio analysis (see TODO.md)
// can read the actual duration off the file. 150s-260s.
function mockDuration(seed) { return 150 + (hashString(seed || 'x') % 110); }

// A short, deterministic pseudo-cue-point pair derived from two song ids, so the
// "detected" cue markers in Add Audio vary per pair instead of always looking identical.
function pseudoCuePoints(leftId, rightId) {
  const h = hashString((leftId || '_') + '|' + (rightId || '_'));
  const out = 90 + (h % 90); // 90s..180s "out" point on the left song
  const inp = 3 + ((h >> 5) % 20); // 3s..23s "in" point on the right song
  return { outSeconds: out, inSeconds: inp };
}

// Stands in for real audio-fingerprint detection: turns a filename+size into a
// deterministic pick of one or two songs from the library, so "uploading" a file
// consistently "detects" the same match every time you try it.
function pickDetectedSongs(songIds, seedText, count) {
  const h = hashString(seedText || 'x');
  const picks = [];
  for (let i = 0; i < count; i++) {
    if (songIds.length === 0) break;
    const idx = (h + i * 2654435761) % songIds.length;
    const id = songIds[Math.abs(idx) % songIds.length];
    if (!picks.includes(id)) picks.push(id);
  }
  let j = 0;
  while (picks.length < count && j < songIds.length) {
    if (!picks.includes(songIds[j])) picks.push(songIds[j]);
    j++;
  }
  return picks;
}

// ---------------------------------------------------------------------------
// Song / edge helpers shared by multiple pages
// ---------------------------------------------------------------------------
function inOutCounts(edges, songId) {
  const inCount = edges.filter(e => e.verified && e.type !== 'outro' && e.r === songId).length;
  const outCount = edges.filter(e => e.verified && e.type !== 'intro' && e.l === songId).length;
  return { inCount, outCount };
}
function getVisibleEdges(edges) { return edges.filter(e => e.verified); }

// One hop of *built* transitions out of a specific song, excluding ids already
// used elsewhere in the current plan. This is the one primitive both the
// "Next" list (from Now Playing) and the "Later" list (from whatever's
// staged in Next) are built from.
function oneHopReachable(visibleEdges, fromId, excludeIds) {
  const out = new Set();
  visibleEdges.filter(e => e.type === 'transition' && e.l === fromId).forEach(e => {
    if (!excludeIds.has(e.r)) out.add(e.r);
  });
  return out;
}

// Removing a song must not leave dangling edges pointing at it.
function removeSongCascade(songs, edges, songId) {
  const nextSongs = { ...songs };
  delete nextSongs[songId];
  const nextEdges = edges.filter(e => e.l !== songId && e.r !== songId);
  return { songs: nextSongs, edges: nextEdges };
}

// ---------------------------------------------------------------------------
// Graph geometry
// ---------------------------------------------------------------------------
const CARD_W = 180;
const END_NODE = { x: 1250, y: 20, w: 130 };

function centerOf(songs, id) {
  if (id === END) return { x: END_NODE.x + END_NODE.w / 2, y: END_NODE.y + 24 };
  const s = songs[id];
  return { x: s.x + CARD_W / 2, y: s.y + 38 };
}
function shorten(x1, y1, x2, y2, pad1, pad2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  return { x1: x1 + ux * pad1, y1: y1 + uy * pad1, x2: x2 - ux * pad2, y2: y2 - uy * pad2 };
}

// ---------------------------------------------------------------------------
// Reachability from the tail of the current queue (or Now Playing if the queue
// is empty). "tier1" is the Next list; the Later list is computed separately,
// live, from whichever song is staged (see oneHopReachable above).
// ---------------------------------------------------------------------------
function computeReachability(songs, visibleEdges, nowPlayingId, queue) {
  const queueHasId = (id) => queue.some(q => q.id === id);
  const tail = queue.length ? queue[queue.length - 1] : null;
  const fromId = tail ? (tail.id === END ? null : tail.id) : nowPlayingId;

  const tier1 = new Set();
  if (fromId) {
    visibleEdges.filter(e => e.type === 'transition' && e.l === fromId).forEach(e => {
      if (e.r !== nowPlayingId && !queueHasId(e.r)) tier1.add(e.r);
    });
    visibleEdges.filter(e => e.type === 'intro').forEach(e => {
      if (e.r !== nowPlayingId && !queueHasId(e.r)) tier1.add(e.r);
    });
    if (!queueHasId(END)) tier1.add(END);
  }
  return { fromId, tier1 };
}

function hopEndingLabel(e) { return e === 'outro' ? 'outro' : 'cut'; }
function hopStartingLabel(s) { return s === 'intro' ? 'intro' : 'cut'; }
function hopSummary(hop) {
  if (hop.id === END) return hopEndingLabel(hop.ending);
  if (hop.mode === 'transition') return 'transition';
  return hopEndingLabel(hop.ending) + ' → ' + hopStartingLabel(hop.starting);
}
// width-only weighting now that every edge/segment renders solid (no dashing):
// built transitions and fully-fragmented hops draw thicker than a raw cut.
function hopWidth(hop, isEndHop) {
  if (isEndHop) return hop.ending === 'outro' ? 3.5 : 2;
  if (hop.mode === 'transition') return 4;
  const eOk = hop.ending === 'outro', sOk = hop.starting === 'intro';
  return (eOk && sOk) ? 3.5 : (eOk || sOk) ? 3 : 2;
}

// ---------------------------------------------------------------------------
// Library list sort/filter
// ---------------------------------------------------------------------------
function libraryRows(songs, edges, search, sortKey, sortDir) {
  const q = search.trim().toLowerCase();
  let rows = Object.keys(songs).map(id => {
    const s = songs[id];
    const { inCount, outCount } = inOutCounts(edges, id);
    return { id, title: s.title, artist: s.artist, bpmNum: s.bpm, bpm: s.bpm + ' BPM', key: s.key, inCount, outCount, isDeadEnd: outCount === 0 };
  });
  if (q) rows = rows.filter(r => r.title.toLowerCase().includes(q) || r.artist.toLowerCase().includes(q));
  const val = (r) => sortKey === 'bpm' ? r.bpmNum : sortKey === 'artist' ? r.artist.toLowerCase() : sortKey === 'key' ? r.key : r.title.toLowerCase();
  rows.sort((a, b) => { const av = val(a), bv = val(b); const c = av < bv ? -1 : av > bv ? 1 : 0; return sortDir === 'asc' ? c : -c; });
  return rows;
}

  CARD_W, END_NODE, centerOf, shorten,
  computeReachability, hopEndingLabel, hopStartingLabel, hopSummary, hopWidth,

};

function Dropzone({ file, onFile, hint }) {

      onDragLeave={() => setDragging(false)}

// =====================================================================================
// App shell — owns the durable data (songs / edges / session / venueName) and the
// small bits of UI state that are shared across more than one page (just the tab).
// =====================================================================================

function App() {
  const [songs, setSongs] = useState(INITIAL.songs);
  const [edges, setEdges] = useState(INITIAL.edges);
  const [session, setSession] = useState(INITIAL.session);
  const [venueName, setVenueName] = useState(INITIAL.venueName);

  const [tab, setTab] = useState('perform');

  // ---- pull anything saved on another device once, on boot (no-op until Supabase is configured) ----
  useEffect(() => {
    Store.pullRemote().then(remote => {
      if (remote && typeof remote === 'object') {
        if (remote.songs) setSongs(remote.songs);
        if (remote.edges) setEdges(remote.edges);
        if (remote.session) setSession(remote.session);
        if (typeof remote.venueName === 'string') setVenueName(remote.venueName);
      }
    });
  }, []);

  // ---- debounced persistence: local write is instant, remote push is best-effort ----
  const saveTimer = useRef(null);
  useEffect(() => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      const data = { songs, edges, session, venueName };
      Store.save(data);
      Store.pushRemote(data);
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [songs, edges, session, venueName]);

  // ---- the set clock: ticks Now Playing's countdown, promotes Next when it hits 0 ----
  useEffect(() => {
    const t = setInterval(() => {
      setSession(prev => {
        if (!prev.isPlaying || !prev.nowPlayingId) return prev;
        if (prev.timeLeft <= 1) {
          const head = prev.queue[0];
          if (head) {
            if (head.id === END) {
              return { ...prev, isPlaying: false, setEnded: true, queue: [], timeLeft: 0 };
            }
            const nextSong = songs[head.id];
            return { ...prev, nowPlayingId: head.id, queue: prev.queue.slice(1), timeLeft: nextSong ? nextSong.durationSec : 210 };
          }
          // nothing armed yet — the window resets rather than the set stalling outright
          const cur = songs[prev.nowPlayingId];
          return { ...prev, timeLeft: cur ? cur.durationSec : 210 };
        }
        return { ...prev, timeLeft: prev.timeLeft - 1 };
      });
    }, 1000);
    return () => clearInterval(t);
  }, [songs]);

  const deleteSong = useCallback((songId) => {
    const result = removeSongCascade(songs, edges, songId);
    setSongs(result.songs);
    setEdges(result.edges);
    setSession(prev => {
      if (prev.nowPlayingId !== songId && !prev.queue.some(q => q.id === songId)) return prev;
      return { ...prev, queue: prev.queue.filter(q => q.id !== songId), isPlaying: prev.nowPlayingId === songId ? false : prev.isPlaying, setEnded: prev.nowPlayingId === songId ? true : prev.setEnded };
    });
  }, [edges, songs]);

  const updateSong = useCallback((songId, patch) => {
    setSongs(prev => (prev[songId] ? { ...prev, [songId]: { ...prev[songId], ...patch } } : prev));
  }, []);

  const deleteEdge = useCallback((edgeId) => {
    setEdges(prev => prev.filter(e => e.id !== edgeId));
  }, []);

  const clearAllData = useCallback(() => {
    Store.clear();
    const fresh = freshState();
    setSongs(fresh.songs); setEdges(fresh.edges); setSession(fresh.session); setVenueName(fresh.venueName);
    setTab('perform');
  }, []);

  const songCount = Object.keys(songs).length;
  const edgeCount = edges.length;

  return (
    <div className="app-shell">
      <Sidebar tab={tab} setTab={setTab} songCount={songCount} edgeCount={edgeCount} venueName={venueName} />
      <div className="main">
        {tab === 'perform' && (
          <PerformPage
            songs={songs} setSongs={setSongs} edges={edges} session={session} setSession={setSession}
            venueName={venueName} goAddAudio={() => setTab('addAudio')} goUpload={() => setTab('upload')}
          />
        )}
        {tab === 'library' && (
          <LibraryPage songs={songs} edges={edges} goUpload={() => setTab('upload')}
            onUpdateSong={updateSong} onDeleteSong={deleteSong} onDeleteEdge={deleteEdge}
            onVerifyEdge={(edgeId) => setEdges(prev => prev.map(e => e.id === edgeId ? { ...e, verified: true } : e))}
          />
        )}
        {tab === 'upload' && (
          <UploadSongPage
            onAddSong={(song) => setSongs(prev => ({ ...prev, [song.id]: song }))}
            onViewSong={() => setTab('library')}
            existingCount={songCount}
          />
        )}
        {tab === 'addAudio' && (
          <AddAudioPage
            songs={songs}
            onAddEdge={(edge) => setEdges(prev => [...prev, edge])}
            onViewSong={() => setTab('library')}
          />
        )}
        {tab === 'settings' && (
          <SettingsPage
            venueName={venueName} setVenueName={setVenueName}
            songs={songs} edges={edges} session={session}
            onClearAll={clearAllData}
            onRestore={(data) => { setSongs(data.songs); setEdges(data.edges); setSession(data.session); setVenueName(data.venueName); }}
          />
        )}
      </div>
    </div>
  );
}
// =====================================================================================
// Perform — Graph pane (plan visually) + Sequence pane (act on it). One state
// machine, two entry points: hovering a node and picking from the Next/Later
// lists both call the exact same stage/commit functions below.
// =====================================================================================

function PerformPage({ songs, setSongs, edges, session, setSession, venueName, goAddAudio, goUpload }) {
  const [searchQuery, setSearchQuery] = useState('');
  const [focusMode, setFocusMode] = useState('all'); // 'all' | 'reachable'
  const [zoom, setZoom] = useState(1);
  const [hoveredId, setHoveredId] = useState(null);
  const hoverTimer = useRef(null);

  // "staged" = selected in the Next list (or via a node's hover card) but not
  // yet committed to the queue. This is what the Later list is computed from.
  const [stagedId, setStagedId] = useState(null);
  const [stagedMode, setStagedMode] = useState('cut'); // 'transition' | 'cut'
  const [stagedEnding, setStagedEnding] = useState('cut'); // how Now Playing ends: 'cut' | 'outro'
  const [stagedStarting, setStagedStarting] = useState('cut'); // how staged song starts: 'cut' | 'intro'
  const [startingSet, setStartingSet] = useState(false); // hard-start picker open

  const zoomRef = useRef(zoom);
  useEffect(() => { zoomRef.current = zoom; }, [zoom]);

  useEffect(() => { setStagedId(null); }, [session.nowPlayingId]);

  const hasStarted = session.nowPlayingId !== null;
  const visibleEdges = useMemo(() => getVisibleEdges(edges), [edges]);
  const reach = useMemo(
    () => hasStarted
      ? computeReachability(songs, visibleEdges, session.nowPlayingId, session.queue)
      : { fromId: null, tier1: new Set(Object.keys(songs)) },
    [songs, visibleEdges, hasStarted, session.nowPlayingId, session.queue]
  );
  const { fromId, tier1 } = reach;

  const usedIds = useMemo(() => {
    const s = new Set([session.nowPlayingId, ...session.queue.map(q => q.id)]);
    return s;
  }, [session.nowPlayingId, session.queue]);
  const laterIds = useMemo(
    () => stagedId ? oneHopReachable(visibleEdges, stagedId, new Set([...usedIds, ...tier1])) : new Set(),
    [stagedId, visibleEdges, usedIds, tier1]
  );

  const findEdge = (pred) => visibleEdges.find(pred);

  function stage(id) {
    if (id === session.nowPlayingId) return;
    const qIdx = session.queue.findIndex(q => q.id === id);
    if (qIdx >= 0) { setSession(prev => ({ ...prev, queue: prev.queue.slice(0, qIdx) })); setStagedId(null); return; }
    if (!fromId) return;
    if (id === END) {
      const outroEdge = findEdge(e => e.type === 'outro' && e.l === fromId);
      setStagedId(END); setStagedEnding(outroEdge ? 'outro' : 'cut');
      return;
    }
    const transitionEdge = findEdge(e => e.type === 'transition' && e.l === fromId && e.r === id);
    const introEdge = findEdge(e => e.type === 'intro' && e.r === id);
    const outroEdge = findEdge(e => e.type === 'outro' && e.l === fromId);
    setStagedId(id);
    setStagedMode(transitionEdge ? 'transition' : 'cut');
    setStagedEnding(outroEdge ? 'outro' : 'cut');
    setStagedStarting(introEdge ? 'intro' : 'cut');
  }

  function commitStaged() {
    if (!stagedId) return;
    if (stagedId === END) {
      setSession(prev => ({ ...prev, queue: [...prev.queue, { id: END, ending: stagedEnding }] }));
      setStagedId(null);
      return;
    }
    const item = stagedMode === 'transition'
      ? { id: stagedId, mode: 'transition' }
      : { id: stagedId, mode: 'cut', ending: stagedEnding, starting: stagedStarting };
    const wasEmpty = session.queue.length === 0;
    const song = songs[stagedId];
    setSession(prev => ({
      ...prev,
      queue: [...prev.queue, item],
      timeLeft: wasEmpty ? prev.timeLeft : prev.timeLeft,
    }));
    setStagedId(null);
  }

  function startSet(songId, starting) {
    const song = songs[songId];
    setSession(prev => ({
      ...prev, nowPlayingId: songId, startMethod: starting,
      queue: [], isPlaying: true, timeLeft: song ? song.durationSec : 210, setEnded: false,
    }));
    setStartingSet(false);
  }
  function togglePlaying() { setSession(prev => ({ ...prev, isPlaying: !prev.isPlaying })); }
  function resumeSet() { setSession(prev => ({ ...prev, setEnded: false, isPlaying: false, nowPlayingId: null, startMethod: null, queue: [], timeLeft: 0 })); }

  // node hover (canvas quick-actions) — small delay so moving toward the card doesn't dismiss it
  function onNodeEnter(id) {
    if (hoverTimer.current) clearTimeout(hoverTimer.current);
    setHoveredId(id);
  }
  function onNodeLeave() {
    hoverTimer.current = setTimeout(() => setHoveredId(null), 150);
  }

  // ---------------- drag-to-reposition a node (vs. a plain click) ----------------
  const dragInfo = useRef(null);
  const stageRef = useRef(stage);
  stageRef.current = stage;
  const onDragMove = useCallback((e) => {
    const d = dragInfo.current; if (!d) return;
    const dx = (e.clientX - d.startX) / zoomRef.current;
    const dy = (e.clientY - d.startY) / zoomRef.current;
    if (!d.moved && Math.hypot(dx, dy) > 4) d.moved = true;
    if (d.moved) {
      const nx = clamp(d.origX + dx, 0, 1400 - CARD_W);
      const ny = clamp(d.origY + dy, 0, 820 - 60);
      setSongs(prev => (prev[d.id] ? { ...prev, [d.id]: { ...prev[d.id], x: nx, y: ny } } : prev));
    }
  }, [setSongs]);
  const onDragUp = useCallback(() => {
    const d = dragInfo.current;
    window.removeEventListener('mousemove', onDragMove);
    window.removeEventListener('mouseup', onDragUp);
    dragInfo.current = null;
    if (d && !d.moved && hasStarted) stageRef.current(d.id);
  }, [onDragMove, hasStarted]);
  function onNodeMouseDown(e, song) {
    e.stopPropagation();
    dragInfo.current = { id: song.id, startX: e.clientX, startY: e.clientY, origX: song.x, origY: song.y, moved: false };
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragUp);
  }
  useEffect(() => () => { window.removeEventListener('mousemove', onDragMove); window.removeEventListener('mouseup', onDragUp); }, [onDragMove, onDragUp]);

  // ---------------- search / focus dimming ----------------
  const q = searchQuery.trim().toLowerCase();
  const searchActive = q.length > 0;
  function matches(id) { const s = songs[id]; return s && (s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q)); }
  function opacityFor(id, exempt) {
    if (exempt) return 1;
    if (searchActive) return matches(id) ? 1 : 0.2;
    if (focusMode === 'reachable' && !tier1.has(id) && !laterIds.has(id)) return 0.3;
    return 1;
  }

  // ---------------- edge classification + drawing (all solid, no per-edge labels) ----------------
  function classify(e) {
    if (e.l === fromId && tier1.has(e.r)) return 'next';
    if (e.l === stagedId && laterIds.has(e.r)) return 'later';
    return 'base';
  }
  const EDGE_STYLE = { base: { stroke: '#c7c7c7', width: 1.5 }, later: { stroke: '#c9bfe0', width: 2.5 }, next: { stroke: '#8b7bb8', width: 3.5 } };
  function mkEdge(e, tier) {
    const c1 = centerOf(songs, e.l), c2 = centerOf(songs, e.r);
    const sh = shorten(c1.x, c1.y, c2.x, c2.y, 62, 62);
    const st = EDGE_STYLE[tier];
    return { ...sh, id: e.id, stroke: st.stroke, strokeWidth: st.width, marker: 'url(#arrow-' + tier + ')' };
  }
  const transitionEdges = visibleEdges.filter(e => e.type === 'transition');
  const baseEdges = transitionEdges.filter(e => classify(e) === 'base').map(e => mkEdge(e, 'base'));
  const laterEdges = transitionEdges.filter(e => classify(e) === 'later').map(e => mkEdge(e, 'later'));
  const nextEdges = transitionEdges.filter(e => classify(e) === 'next').map(e => mkEdge(e, 'next'));

  // ---------------- the committed plan-path, regardless of whether it follows built content ----------------
  const chain = hasStarted ? [{ id: session.nowPlayingId }, ...session.queue.map(q2 => ({ id: q2.id }))] : [];
  const planSegments = [];
  for (let i = 0; i < chain.length - 1; i++) {
    const a = chain[i], b = chain[i + 1];
    const hop = session.queue[i];
    const c1 = centerOf(songs, a.id), c2 = centerOf(songs, b.id);
    const pad1 = a.id === END ? 40 : 62, pad2 = b.id === END ? 40 : 62;
    const sh = shorten(c1.x, c1.y, c2.x, c2.y, pad1, pad2);
    planSegments.push({ id: 'plan' + i, ...sh, width: hopWidth(hop, b.id === END) });
  }

  const nowSong = hasStarted ? songs[session.nowPlayingId] : null;
  const cueBarPct = nowSong && nowSong.durationSec ? Math.round((1 - session.timeLeft / nowSong.durationSec) * 100) : 0;

  function optionsFor(id) {
    if (id === END) {
      const outroEdge = findEdge(e => e.type === 'outro' && e.l === fromId);
      return { title: 'End Set', outroEdge };
    }
    const s = songs[id];
    const transitionEdge = findEdge(e => e.type === 'transition' && e.l === fromId && e.r === id);
    const introEdge = findEdge(e => e.type === 'intro' && e.r === id);
    const outroEdge = findEdge(e => e.type === 'outro' && e.l === fromId);
    return { title: s.title, artist: s.artist, transitionEdge, introEdge, outroEdge };
  }

  if (Object.keys(songs).length === 0) {
    return (
      <div className="page page-perform">
        <div className="empty-state">
          <div className="empty-state-title">Your graph is empty</div>
          <div className="empty-state-sub">Add your first song, then come back here to lay out your set and connect it to others.</div>
          <button className="btn btn-primary" onClick={goUpload}>Upload a song</button>
        </div>
      </div>
    );
  }

  const hoveredSong = hoveredId && hoveredId !== END ? songs[hoveredId] : null;

  return (
    <div className="page page-perform">
      <div className="toolbar">
        <input className="input toolbar-search" placeholder="Find a song or artist…" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
        <div className="pill-group">
          <button className={'pill' + (focusMode === 'all' ? ' active' : '')} onClick={() => setFocusMode('all')}>All songs</button>
          <button className={'pill' + (focusMode === 'reachable' ? ' active' : '')} onClick={() => setFocusMode('reachable')}>Reachable now</button>
        </div>
        <div className="legend">
          <span><i className="swatch swatch-dot" />playing</span>
          <span><i className="swatch swatch-next" />next</span>
          <span><i className="swatch swatch-later" />later</span>
          <span><i className="swatch swatch-line" />planned</span>
        </div>
        <div className="zoom-controls">
          <button className="zoom-btn" onClick={() => setZoom(z => clamp(Math.round((z - 0.1) * 10) / 10, 0.6, 1.4))}>−</button>
          <span className="zoom-label">{Math.round(zoom * 100)}%</span>
          <button className="zoom-btn" onClick={() => setZoom(z => clamp(Math.round((z + 0.1) * 10) / 10, 0.6, 1.4))}>+</button>
        </div>
      </div>

      <div className="perform-layout">
        <div className="graph-pane">
          <div className="canvas-wrap">
            <div className="canvas-scroll">
              <div className="canvas-sizer" style={{ width: Math.round(1400 * zoom), height: Math.round(820 * zoom) }}>
                <div className="canvas-scale" style={{ transform: 'scale(' + zoom + ')' }}>
                  <svg width="1400" height="820" className="edge-svg">
                    <defs>
                      <marker id="arrow-base" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c7c7c7" /></marker>
                      <marker id="arrow-later" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9bfe0" /></marker>
                      <marker id="arrow-next" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b7bb8" /></marker>
                      <marker id="arrow-plan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#131313" /></marker>
                    </defs>
                    {[...baseEdges, ...laterEdges, ...nextEdges].map(be => (
                      <line key={be.id} x1={be.x1} y1={be.y1} x2={be.x2} y2={be.y2} stroke={be.stroke} strokeWidth={be.strokeWidth} markerEnd={be.marker} />
                    ))}
                    {planSegments.map(ps => (
                      <line key={ps.id} x1={ps.x1} y1={ps.y1} x2={ps.x2} y2={ps.y2} stroke="#131313" strokeWidth={ps.width} markerEnd="url(#arrow-plan)" />
                    ))}
                  </svg>

                  {Object.values(songs).map(s => {
                    const isNow = s.id === session.nowPlayingId;
                    const qIdx = session.queue.findIndex(q2 => q2.id === s.id);
                    const isQueued = qIdx >= 0;
                    const isNext = !isNow && !isQueued && tier1.has(s.id);
                    const isLater = !isNow && !isQueued && !isNext && laterIds.has(s.id);
                    const dark = isNow || isQueued;
                    const { inCount, outCount } = inOutCounts(edges, s.id);
                    const cls = ['node-card', dark && 'node-dark', isNow && 'node-now', isNext && 'node-tier1', isLater && 'node-tier2', hoveredId === s.id && 'node-hovered'].filter(Boolean).join(' ');
                    return (
                      <div
                        key={s.id}
                        className={cls}
                        style={{ left: s.x, top: s.y, width: CARD_W, opacity: opacityFor(s.id, dark) }}
                        onMouseDown={(e) => onNodeMouseDown(e, s)}
                        onMouseEnter={() => onNodeEnter(s.id)}
                        onMouseLeave={onNodeLeave}
                      >
                        {(isNow || isQueued) && <div className="node-badge">{isNow ? 'NOW' : qIdx + 1}</div>}
                        <div className="node-title">{s.title}</div>
                        <div className="node-artist">{s.artist}</div>
                        <div className="node-tags">
                          <span className="tag tag-accent">{s.bpm} BPM</span>
                          <span className="tag tag-good">{s.key}</span>
                        </div>
                        <div className="node-io">↓{inCount} ↑{outCount}</div>
                      </div>
                    );
                  })}

                  {hasStarted && (() => {
                    const endIdx = session.queue.findIndex(q2 => q2.id === END);
                    const endQueued = endIdx >= 0;
                    const endNext = !endQueued && tier1.has(END);
                    const cls = ['end-node', endQueued && 'node-dark', endNext && 'node-tier1'].filter(Boolean).join(' ');
                    const opacity = (focusMode === 'reachable' && !endNext && !endQueued) ? 0.3 : 1;
                    return (
                      <div className={cls} style={{ left: END_NODE.x, top: END_NODE.y, width: END_NODE.w, opacity }}
                        onMouseEnter={() => onNodeEnter(END)} onMouseLeave={onNodeLeave}
                        onClick={() => hasStarted && stage(END)}>
                        {endQueued && <div className="node-badge">{endIdx + 1}</div>}
                        <div className="end-node-title"><Icon path={<rect x="5" y="5" width="14" height="14" />} filled size={11} /> End Set</div>
                        <div className="end-node-hint">{endQueued ? 'queued' : 'stop here'}</div>
                      </div>
                    );
                  })()}

                  {hoveredId && hoveredId !== END && hoveredSong && hasStarted && tier1.has(hoveredId) && (() => {
                    const opts = optionsFor(hoveredId);
                    const isStagedHere = stagedId === hoveredId;
                    return (
                      <div className="hover-card" style={{ left: clamp(hoveredSong.x + CARD_W + 10, 0, 1400 - 220), top: hoveredSong.y }}
                        onMouseEnter={() => onNodeEnter(hoveredId)} onMouseLeave={onNodeLeave}>
                        <div className="hover-card-title">{opts.title}</div>
                        <div className="hover-card-artist">{opts.artist}</div>
                        <div className="hover-card-row">
                          <button className={'hover-toggle' + (isStagedHere ? ' active' : '')} onClick={() => stage(hoveredId)}>Next</button>
                          <button className="hover-toggle" disabled={!isStagedHere} onClick={commitStaged}>Confirm</button>
                        </div>
                        {isStagedHere && (
                          <div className="hover-card-row">
                            <button className={'hover-toggle' + (stagedMode === 'transition' ? ' active' : '')} disabled={!opts.transitionEdge} onClick={() => setStagedMode('transition')}>Trans.</button>
                            <button className={'hover-toggle' + (stagedMode === 'cut' ? ' active' : '')} onClick={() => setStagedMode('cut')}>Cut</button>
                          </div>
                        )}
                      </div>
                    );
                  })()}
                </div>
              </div>
            </div>
          </div>
        </div>

        <SequencePane
          songs={songs} session={session} venueName={venueName}
          hasStarted={hasStarted} nowSong={nowSong} cueBarPct={cueBarPct}
          tier1={tier1} laterIds={laterIds} stagedId={stagedId} stagedMode={stagedMode} stagedEnding={stagedEnding} stagedStarting={stagedStarting}
          startingSet={startingSet} setStartingSet={setStartingSet}
          onTogglePlaying={togglePlaying} onResumeSet={resumeSet} onStartSet={startSet}
          onStage={stage} onCommitStaged={commitStaged}
          onSetStagedMode={setStagedMode} onSetStagedEnding={setStagedEnding} onSetStagedStarting={setStagedStarting}
          optionsFor={optionsFor} goAddAudio={goAddAudio}
        />
      </div>
    </div>
  );
}

// =====================================================================================
// Sequence pane — persistent, always-visible hard-start/hard-stop/transition controls.
// Two lists: Next (one hop from Playing) and Later (one hop from whatever's staged in
// Next) — pick in Next, preview Later, confirm, repeat.
// =====================================================================================

function SequencePane({
  songs, session, venueName, hasStarted, nowSong, cueBarPct,
  tier1, laterIds, stagedId, stagedMode, stagedEnding, stagedStarting,
  startingSet, setStartingSet, onTogglePlaying, onResumeSet, onStartSet,
  onStage, onCommitStaged, onSetStagedMode, onSetStagedEnding, onSetStagedStarting,
  optionsFor, goAddAudio,
}) {
  const [startPickId, setStartPickId] = useState(null);
  const [startStarting, setStartStarting] = useState('cut');

  const nextRows = Array.from(tier1).map(id => ({ id, ...optionsFor(id) }));
  const laterRows = stagedId ? Array.from(laterIds).map(id => ({ id, ...optionsFor(id) })) : [];

  function Row({ row, isEnd, isStaged, onClick, showToggles }) {
    return (
      <div className={'seq-row' + (isStaged ? ' seq-row-staged' : '')} onClick={onClick}>
        <div className="seq-row-main">
          <div className="seq-row-text">
            <div className="seq-row-title">{row.title}</div>
            {!isEnd && <div className="seq-row-artist">{row.artist}</div>}
          </div>
          {!isEnd && <span className="seq-row-countdown mono-num">{fmtTime(session.timeLeft)}</span>}
        </div>
        {showToggles && (
          <div className="seq-row-toggles">
            {!isEnd ? (
              <>
                <button className={'seq-toggle' + (stagedMode === 'transition' ? ' active' : '')} disabled={!row.transitionEdge}
                  onClick={(e) => { e.stopPropagation(); onSetStagedMode('transition'); }}>Transition</button>
                <button className={'seq-toggle' + (stagedMode === 'cut' && stagedStarting === 'cut' ? ' active' : '')}
                  onClick={(e) => { e.stopPropagation(); onSetStagedMode('cut'); onSetStagedStarting('cut'); }}>Cut</button>
                <button className={'seq-toggle' + (stagedMode === 'cut' && stagedStarting === 'intro' ? ' active' : '')} disabled={!row.introEdge}
                  onClick={(e) => { e.stopPropagation(); onSetStagedMode('cut'); onSetStagedStarting('intro'); }}>Intro</button>
              </>
            ) : (
              <>
                <button className={'seq-toggle' + (stagedEnding === 'cut' ? ' active' : '')}
                  onClick={(e) => { e.stopPropagation(); onSetStagedEnding('cut'); }}>Cut</button>
                <button className={'seq-toggle' + (stagedEnding === 'outro' ? ' active' : '')} disabled={!row.outroEdge}
                  onClick={(e) => { e.stopPropagation(); onSetStagedEnding('outro'); }}>Outro</button>
              </>
            )}
            <button className="btn btn-accent btn-xs" onClick={(e) => { e.stopPropagation(); onCommitStaged(); }}>Set</button>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="sequence-pane">
      <div className="seq-scroll">
        <div className="seq-venue">{venueName || 'Untitled session'}</div>

        {!hasStarted ? (
          <div className="seq-start-card">
            <div className="section-label">Start the set</div>
            <SongPicker songs={songs} value={startPickId} onChange={setStartPickId} placeholder="Search songs…" />
            {startPickId && (
              <>
                <div className="seq-row-toggles" style={{ marginTop: 9 }}>
                  <button className={'seq-toggle' + (startStarting === 'cut' ? ' active' : '')} onClick={() => setStartStarting('cut')}>Cut</button>
                  <button className={'seq-toggle' + (startStarting === 'intro' ? ' active' : '')} onClick={() => setStartStarting('intro')}>Intro</button>
                </div>
                <button className="btn btn-primary" style={{ width: '100%', marginTop: 9 }} onClick={() => onStartSet(startPickId, startStarting)}>Start playing</button>
              </>
            )}
          </div>
        ) : (
          <div className="seq-now-card">
            <div className="section-label section-label-dark">Playing</div>
            <div className="seq-now-row">
              <button className="seq-play-btn" onClick={onTogglePlaying}>
                <Icon path={session.isPlaying ? ICONS.pause : ICONS.play} filled={!session.isPlaying} size={14} />
              </button>
              <div className="seq-now-text">
                <div className="seq-now-title">{nowSong.title}</div>
                <div className="seq-now-artist">{nowSong.artist}</div>
              </div>
            </div>
            <div className="seq-now-tags">
              <span className="tag">{nowSong.bpm} BPM</span>
              <span className="tag">{nowSong.key}</span>
            </div>
            <div className="seq-countdown-track"><div className="seq-countdown-fill" style={{ width: cueBarPct + '%' }} /></div>
            <div className="seq-countdown-label mono-num">{fmtTime(session.timeLeft)} left to cue</div>
            <button className="btn seq-endset-btn" onClick={() => onStage(END)}>End Set</button>
          </div>
        )}

        {session.setEnded && (
          <div className="success-note">
            <span>Set ended.</span>
            <button className="btn btn-primary btn-sm" onClick={onResumeSet}>Start a new set</button>
          </div>
        )}

        {hasStarted && !session.setEnded && (
          <>
            <div>
              <div className="seq-list-title">Next</div>
              <div className="seq-list">
                {nextRows.map(row => (
                  <Row key={row.id} row={row} isEnd={row.id === END} isStaged={stagedId === row.id}
                    showToggles={stagedId === row.id} onClick={() => onStage(row.id)} />
                ))}
                {nextRows.length === 0 && <div className="seq-empty">nothing built out of this song yet</div>}
              </div>
            </div>

            <div>
              <div className="seq-list-title">Later</div>
              <div className="seq-list">
                {laterRows.map(row => (
                  <Row key={row.id} row={row} isEnd={false} isStaged={false} showToggles={false} onClick={() => {}} />
                ))}
                {!stagedId && <div className="seq-empty">pick something in Next to preview what follows it</div>}
                {stagedId && laterRows.length === 0 && <div className="seq-empty">nothing built past that pick yet</div>}
              </div>
            </div>

            {session.queue.length > 0 && (
              <div>
                <div className="seq-list-title">Path</div>
                <div className="seq-path">
                  {session.queue.map((q, i) => (
                    <React.Fragment key={q.id + i}>
                      <span className="seq-path-arrow">→</span>
                      <span className="seq-path-chip">{q.id === END ? 'End' : (songs[q.id] ? songs[q.id].title : '(deleted)')}</span>
                    </React.Fragment>
                  ))}
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}
// =====================================================================================
// Library — a flat, searchable accordion. Click a row to see its built pieces and edit
// its details inline; no separate floating panel.
// =====================================================================================

function LibraryRow({ row, song, edges, open, onToggle, onUpdateSong, onDeleteSong, onDeleteEdge, onVerifyEdge }) {
  const [editing, setEditing] = useState(false);
  const [draftTitle, setDraftTitle] = useState(song.title);
  const [draftArtist, setDraftArtist] = useState(song.artist);
  const [draftBpm, setDraftBpm] = useState(String(song.bpm));
  const [draftKey, setDraftKey] = useState(song.key);

  function saveEdits() {
    const bpmNum = Number(draftBpm);
    onUpdateSong(song.id, {
      title: draftTitle.trim() || song.title, artist: draftArtist.trim() || song.artist,
      bpm: Number.isFinite(bpmNum) && bpmNum > 0 ? bpmNum : song.bpm, key: draftKey.trim() || song.key,
    });
    setEditing(false);
  }
  function destText(e) {
    if (e.type === 'outro') return 'ends set';
    if (e.type === 'intro') return 'cold-open';
    const other = e.l === song.id ? e.r : e.l;
    return (e.l === song.id ? '→ ' : '← ') + (row.songs && row.songs[other] ? row.songs[other].title : '');
  }
  function labelOf(e) { return e.type === 'outro' ? 'Outro' : e.type === 'intro' ? 'Intro' : 'Transition'; }
  const ownEdges = edges.filter(e => e.l === song.id || e.r === song.id);

  function confirmDelete() {
    if (window.confirm('Delete "' + song.title + '"? This also removes every transition/intro/outro that touches it.')) onDeleteSong(song.id);
  }

  return (
    <div className={'lib-row' + (open ? ' lib-row-open' : '')}>
      <div className="lib-row-head" onClick={onToggle}>
        <span className="lib-chevron"><Icon path={ICONS.chevron} size={13} /></span>
        <div className="lib-title-wrap">
          <span className="lib-title">{row.title}</span>
          <span className="lib-artist">{row.artist}</span>
        </div>
        <div className="lib-tags">
          <span className="tag tag-accent">{row.bpm}</span>
          <span className="tag tag-good">{row.key}</span>
          {row.isDeadEnd && <span className="tag tag-warn">dead end</span>}
        </div>
        <div className="lib-io mono-num">↓{row.inCount} ↑{row.outCount}</div>
      </div>
      {open && (
        <div className="lib-body">
          {!editing ? (
            <div className="drawer-actions-row" style={{ display: 'flex', gap: 7 }}>
              <button className="btn btn-ghost btn-sm" onClick={() => setEditing(true)}>Edit details</button>
              <button className="btn btn-danger btn-sm" onClick={confirmDelete}>Delete song</button>
            </div>
          ) : (
            <div className="lib-edit-row">
              <Field label="Title"><input className="input" value={draftTitle} onChange={(e) => setDraftTitle(e.target.value)} /></Field>
              <Field label="Artist"><input className="input" value={draftArtist} onChange={(e) => setDraftArtist(e.target.value)} /></Field>
              <Field label="BPM"><input className="input" value={draftBpm} onChange={(e) => setDraftBpm(e.target.value)} /></Field>
              <Field label="Key"><input className="input" value={draftKey} onChange={(e) => setDraftKey(e.target.value)} /></Field>
              <button className="btn btn-primary btn-sm" onClick={saveEdits}>Save</button>
              <button className="btn btn-ghost btn-sm" onClick={() => setEditing(false)}>Cancel</button>
            </div>
          )}
          <div>
            <div className="section-label">Built audio</div>
            <div className="lib-pieces">
              {ownEdges.map(e => (
                <div key={e.id} className="drawer-frag">
                  <div className="drawer-frag-row">
                    <span className="drawer-frag-label">{labelOf(e)}</span>
                    {e.verified && <span className="dot-verified" />}
                    <div className="drawer-frag-actions">
                      {!e.verified && <button className="btn btn-ghost btn-xs" onClick={() => onVerifyEdge(e.id)}>Preview &amp; verify</button>}
                      <button className="btn btn-ghost btn-xs" onClick={() => { if (window.confirm('Remove this ' + labelOf(e).toLowerCase() + '?')) onDeleteEdge(e.id); }}>Remove</button>
                    </div>
                  </div>
                  <div className="drawer-frag-dest">{destText(e)}</div>
                </div>
              ))}
              {ownEdges.length === 0 && <div className="empty-note-sm">nothing built for this song yet</div>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function LibraryPage({ songs, edges, goUpload, onUpdateSong, onDeleteSong, onDeleteEdge, onVerifyEdge }) {
  const [search, setSearch] = useState('');
  const [openId, setOpenId] = useState(null);

  const totalSongs = Object.keys(songs).length;
  const rows = useMemo(() => libraryRows(songs, edges, search, 'title', 'asc').map(r => ({ ...r, songs })), [songs, edges, search]);

  if (totalSongs === 0) {
    return (
      <div className="page page-scroll">
        <div className="page-header"><div className="page-title">Library</div></div>
        <div className="empty-state">
          <div className="empty-state-title">No songs yet</div>
          <div className="empty-state-sub">Upload your first track to start building your library.</div>
          <button className="btn btn-primary" onClick={goUpload}>Upload a song</button>
        </div>
      </div>
    );
  }

  return (
    <div className="page page-scroll">
      <div className="page-header">
        <div className="page-title">Library</div>
        <button className="btn btn-primary" onClick={goUpload}>+ New song</button>
      </div>
      <div className="page-sub">Every song in the crate. Click a row for its built transitions and to edit it.</div>
      <input className="input" style={{ maxWidth: 320, marginBottom: 16 }} placeholder="Find a song or artist…" value={search} onChange={(e) => setSearch(e.target.value)} />

      <div>
        {rows.map(r => (
          <LibraryRow key={r.id} row={r} song={songs[r.id]} edges={edges} open={openId === r.id}
            onToggle={() => setOpenId(id => (id === r.id ? null : r.id))}
            onUpdateSong={onUpdateSong} onDeleteSong={onDeleteSong} onDeleteEdge={onDeleteEdge} onVerifyEdge={onVerifyEdge} />
        ))}
      </div>
      {rows.length === 0 && <div className="empty-note">no songs match "{search}"</div>}
    </div>
  );
}

// =====================================================================================
// Upload Song — add a brand-new master to the library. A remix is just another song
// here (its own bpm/key/id) — there's no separate "version" concept anymore.
// =====================================================================================

function UploadSongPage({ onAddSong, onViewSong, existingCount }) {
  const [title, setTitle] = useState('');
  const [artist, setArtist] = useState('');
  const [bpm, setBpm] = useState('');
  const [key, setKey] = useState('');
  const [file, setFile] = useState(null);
  const [error, setError] = useState('');
  const [saved, setSaved] = useState(null);
  const [uploading, setUploading] = useState(false);

  async function save() {
    if (!title.trim()) { setError('Give the song a title.'); return; }
    const bpmNum = Number(bpm);
    if (bpm.trim() && (!Number.isFinite(bpmNum) || bpmNum <= 0)) { setError('BPM should be a positive number.'); return; }
    setError('');
    setUploading(true);
    const audio = await uploadAudioIfConfigured(file);
    setUploading(false);
    const id = uid('s');
    const song = {
      id, title: title.trim(), artist: artist.trim() || 'Unknown',
      x: 60 + (existingCount * 47) % 1180, y: 60 + (existingCount * 83) % 700,
      bpm: bpmNum || 120, key: key.trim() || '—',
      durationSec: mockDuration(title + artist), audioUrl: audio.audioUrl || null,
    };
    onAddSong(song);
    setSaved({ id, title: song.title });
    setTitle(''); setArtist(''); setBpm(''); setKey(''); setFile(null);
  }

  return (
    <div className="page page-scroll page-narrow">
      <div className="page-title">Upload Song</div>
      <div className="page-sub">Add a new master to the library. A remix is just its own song here — give it its own title/BPM/key and connect it with Add Audio like anything else.</div>

      <div className="form-card">
        <Field label="Title"><input className="input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="e.g. Faultline Blue" /></Field>
        <Field label="Artist"><input className="input" value={artist} onChange={(e) => setArtist(e.target.value)} placeholder="e.g. Nomi Sato" /></Field>
        <div className="form-grid-2">
          <Field label="BPM"><input className="input" value={bpm} onChange={(e) => setBpm(e.target.value)} placeholder="126" inputMode="numeric" /></Field>
          <Field label="Key"><input className="input" value={key} onChange={(e) => setKey(e.target.value)} placeholder="A min" /></Field>
        </div>
        <Field label="Master audio">
          <Dropzone file={file} onFile={setFile} hint="drop lossless master (WAV/AIFF/FLAC preferred; MP3 accepted, flagged)" />
        </Field>
        {error && <div className="error-note">{error}</div>}
        <button className="btn btn-primary btn-self-start" onClick={save} disabled={uploading}>{uploading ? 'Uploading…' : 'Add to library'}</button>
        {saved && (
          <div className="success-note">
            <span>Added "{saved.title}" to the library.</span>
            <button className="btn btn-primary btn-sm" onClick={() => onViewSong(saved.id)}>View in Library</button>
          </div>
        )}
      </div>
    </div>
  );
}
// =====================================================================================
// Add Audio — drop a produced piece; we detect what it connects and let you confirm.
// =====================================================================================

function AddAudioPage({ songs, onAddEdge, onViewSong }) {
  const [file, setFile] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [detected, setDetected] = useState(false);
  const [leftId, setLeftId] = useState(null);
  const [rightId, setRightId] = useState(null);
  const [fragLabel, setFragLabel] = useState('');
  const [error, setError] = useState('');
  const [saved, setSaved] = useState(null);
  const [uploading, setUploading] = useState(false);

  const songIds = Object.keys(songs);

  function reset() {
    setFile(null); setAnalyzing(false); setDetected(false);
    setLeftId(null); setRightId(null); setFragLabel(''); setError('');
  }

  function handleFile(f) {
    setFile(f); setAnalyzing(true); setDetected(false); setSaved(null);
    const seed = f.name + '|' + f.size;
    setTimeout(() => {
      const [a, b] = pickDetectedSongs(songIds, seed, 2);
      setLeftId(a || null); setRightId(b || null);
      setAnalyzing(false); setDetected(true);
    }, 700);
  }

  const leftSong = leftId ? songs[leftId] : null;
  const rightSong = rightId ? songs[rightId] : null;
  const derivedType = leftId && rightId ? 'transition' : rightId ? 'intro' : leftId ? 'outro' : null;
  const cue = detected ? pseudoCuePoints(leftId, rightId) : null;

  async function saveEdge() {
    if (!derivedType) { setError('This needs at least one song — pick a left and/or right side.'); return; }
    setUploading(true);
    const audio = await uploadAudioIfConfigured(file);
    setUploading(false);
    const edge = {
      id: uid('e'), type: derivedType,
      l: leftId || undefined, r: rightId || undefined,
      verified: false, label: fragLabel.trim() || undefined, audioUrl: audio.audioUrl || null,
    };
    onAddEdge(edge);
    setSaved({ label: derivedType, songId: rightId || leftId });
    reset();
  }

  const typeLabel = derivedType ? ({ transition: 'Transition', intro: 'Intro', outro: 'Outro' })[derivedType] : '—';

  if (songIds.length === 0) {
    return (
      <div className="page page-scroll page-narrow-wide">
        <div className="page-title">Add Audio</div>
        <div className="empty-state">
          <div className="empty-state-title">Add a song first</div>
          <div className="empty-state-sub">You'll need at least one song in the library before there's anything to connect.</div>
        </div>
      </div>
    );
  }

  return (
    <div className="page page-scroll page-narrow-wide">
      <div className="page-title">Add Audio</div>
      <div className="page-sub">Drop a produced transition, intro, or outro — we detect the song(s), type, and cue points automatically. A remix is a new song (Upload Song), not audio to attach here.</div>

      <div className="form-card">
        <Field label="Produced audio">
          <Dropzone file={file} onFile={handleFile} hint="drop the finished transition, intro, or outro render" />
        </Field>

        {analyzing && <div className="hint-text analyzing-hint">Analyzing audio…</div>}

        {detected && (
          <>
            <div className="detected-label">Detected</div>
            <div className="pair-grid">
              <div>
                <div className="field-label">Left side (what it plays out of)</div>
                <SongPicker songs={songs} value={leftId} onChange={setLeftId} allowFree freeLabel="Free — starts the set" />
              </div>
              <div>
                <div className="field-label">Right side (what it plays into)</div>
                <SongPicker songs={songs} value={rightId} onChange={setRightId} allowFree freeLabel="Free — ends the set" />
              </div>
            </div>

            <div className="detected-summary">
              <span className="tag tag-neutral">Type: {typeLabel}</span>
              {leftSong && rightSong && (
                <>
                  <span className="tag tag-accent">{leftSong.bpm} → {rightSong.bpm} BPM</span>
                  <span className="tag tag-good">{leftSong.key} → {rightSong.key}</span>
                </>
              )}
            </div>

            {cue && (
              <div className="cue-grid">
                {leftSong && (
                  <div>
                    <div className="field-label">{leftSong.title} — detected out point</div>
                    <div className="waveform-bar">
                      <div className="waveform-marker" style={{ left: '71%' }} />
                      <div className="waveform-marker-label" style={{ left: '71%' }}>OUT <span className="mono-num">{fmtTime(cue.outSeconds)}</span></div>
                    </div>
                  </div>
                )}
                {rightSong && (
                  <div>
                    <div className="field-label">{rightSong.title} — detected in point</div>
                    <div className="waveform-bar">
                      <div className="waveform-marker" style={{ left: '12%' }} />
                      <div className="waveform-marker-label" style={{ left: '12%' }}>IN <span className="mono-num">{fmtTime(cue.inSeconds)}</span></div>
                    </div>
                  </div>
                )}
              </div>
            )}

            <Field label="Note (optional)">
              <input className="input" value={fragLabel} onChange={(e) => setFragLabel(e.target.value)} placeholder="e.g. Tempo drop into verse" />
            </Field>
          </>
        )}

        {error && <div className="error-note">{error}</div>}
        {detected && <button className="btn btn-primary btn-self-start" onClick={saveEdge} disabled={uploading}>{uploading ? 'Uploading…' : 'Save ' + typeLabel}</button>}

        {saved && (
          <div className="success-note">
            <span>Saved — unverified. Preview it from Library to verify it.</span>
            {saved.songId && <button className="btn btn-primary btn-sm" onClick={() => onViewSong(saved.songId)}>View in Library</button>}
          </div>
        )}
      </div>
    </div>
  );
}

// =====================================================================================
// Settings — venue name, data reset, manual JSON backup, and Supabase sync status.
// =====================================================================================

function SettingsPage({ venueName, setVenueName, songs, edges, session, onClearAll, onRestore }) {
  const [confirmingReset, setConfirmingReset] = useState(false);
  const fileInputRef = useRef(null);
  const [importError, setImportError] = useState('');
  const syncOn = !!(window.APP_CONFIG && window.APP_CONFIG.SUPABASE_URL && window.APP_CONFIG.SUPABASE_ANON_KEY);
  const uploadOn = !!(window.APP_CONFIG && window.APP_CONFIG.UPLOAD_WORKER_URL);

  function downloadBackup() {
    const data = { songs, edges, session, venueName };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'eskimo-studio-backup.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function handleImportFile(fileList) {
    const f = fileList && fileList[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data.songs || !data.edges || !data.session) throw new Error('missing fields');
        onRestore(data);
        setImportError('');
      } catch (e) {
        setImportError('That file doesn’t look like an Eskimo Studio backup.');
      }
    };
    reader.readAsText(f);
  }

  return (
    <div className="page page-scroll page-narrow">
      <div className="page-title">Settings</div>
      <div className="page-sub">Data always lives in this browser first. See TODO.md to turn on cloud sync + audio storage.</div>

      <div className="section-label">Cloud sync</div>
      <div className="form-card" style={{ marginBottom: 20 }}>
        <div className="settings-row">
          <div>
            <div className="settings-row-title">Supabase sync</div>
            <div className="settings-row-sub">{syncOn ? 'Configured — this browser syncs in the background.' : 'Not set up yet — add your project keys at the top of index.html.'}</div>
          </div>
          <span className={'tag ' + (syncOn ? 'tag-good' : 'tag-warn')}>{syncOn ? 'ON' : 'OFF'}</span>
        </div>
        <div className="settings-row">
          <div>
            <div className="settings-row-title">Audio uploads</div>
            <div className="settings-row-sub">{uploadOn ? 'Configured — dropped files upload to your R2 bucket.' : 'Not set up yet — deploy worker/upload-worker.js and add its URL.'}</div>
          </div>
          <span className={'tag ' + (uploadOn ? 'tag-good' : 'tag-warn')}>{uploadOn ? 'ON' : 'OFF'}</span>
        </div>
      </div>

      <div className="form-card">
        <Field label="Venue / session name">
          <input className="input" value={venueName} onChange={(e) => setVenueName(e.target.value)} placeholder="e.g. Friday Warehouse" />
        </Field>
      </div>

      <div className="section-label" style={{ marginTop: 24 }}>Backup</div>
      <div className="form-card">
        <div className="settings-row">
          <div>
            <div className="settings-row-title">Download a backup</div>
            <div className="settings-row-sub">Saves your whole library and set state to a JSON file.</div>
          </div>
          <button className="btn btn-ghost" onClick={downloadBackup}>Download</button>
        </div>
        <div className="settings-row">
          <div>
            <div className="settings-row-title">Restore from a backup</div>
            <div className="settings-row-sub">Replaces everything currently in the browser.</div>
          </div>
          <button className="btn btn-ghost" onClick={() => fileInputRef.current && fileInputRef.current.click()}>Restore…</button>
          <input ref={fileInputRef} type="file" accept="application/json" style={{ display: 'none' }} onChange={(e) => handleImportFile(e.target.files)} />
        </div>
        {importError && <div className="error-note">{importError}</div>}
      </div>

      <div className="section-label" style={{ marginTop: 24 }}>Reset</div>
      <div className="form-card">
        <div className="settings-row">
          <div>
            <div className="settings-row-title">Clear all data</div>
            <div className="settings-row-sub">Wipes every song, transition, and set state saved in this browser. This does not undo — download a backup first if you're not sure.</div>
          </div>
          {!confirmingReset ? (
            <button className="btn btn-danger" onClick={() => setConfirmingReset(true)}>Clear…</button>
          ) : (
            <div style={{ display: 'flex', gap: 8 }}>
              <button className="btn btn-ghost btn-sm" onClick={() => setConfirmingReset(false)}>Cancel</button>
              <button className="btn btn-danger btn-sm" onClick={onClearAll}>Confirm — clear everything</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// =====================================================================================
// A minimal error boundary — surfaces a readable message instead of a blank page
// while this is still being developed.
// =====================================================================================
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('Eskimo Studio crashed:', error, info); }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 40, fontFamily: 'monospace', whiteSpace: 'pre-wrap', color: '#a3312a' }}>
          <div style={{ fontWeight: 700, marginBottom: 10 }}>Something broke: {String(this.state.error && this.state.error.message || this.state.error)}</div>
          {this.state.error && this.state.error.stack}
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
})();
</script>
